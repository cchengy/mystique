services:
  workspace-init:
    build: .
    user: "0:0"
    command:
      - sh
      - -c
      - >-
        mkdir -p /app/good/workspace/adapters /app/good/workspace/bank
        /app/good/workspace/auditorias /app/evil/workspace/absorcoes
        /app/evil/workspace/bank &&
        chown -R 999:999 /app/good/workspace /app/evil/workspace
    restart: "no"
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    security_opt:
      - no-new-privileges:true
    volumes:
      - mystique-workspace:/app/good/workspace
      - mystique-evil-workspace:/app/evil/workspace

  mystique:
    build: .
    restart: unless-stopped
    depends_on:
      workspace-init:
        condition: service_completed_successfully
    expose:
      - "8000"
    environment:
      MYSTIQUE_MODO: ${MYSTIQUE_MODO:-good}
      MYSTIQUE_PROVIDER: ${MYSTIQUE_PROVIDER:-openai}
      MYSTIQUE_BASE_URL: ${MYSTIQUE_BASE_URL}
      MYSTIQUE_MODEL_ID: ${MYSTIQUE_MODEL_ID}
      MYSTIQUE_WORLD_PROVIDER: ${MYSTIQUE_WORLD_PROVIDER:-openai}
      MYSTIQUE_WORLD_BASE_URL: ${MYSTIQUE_WORLD_BASE_URL}
      MYSTIQUE_WORLD_MODEL: ${MYSTIQUE_WORLD_MODEL}
      MYSTIQUE_WORLD_API_KEY: ${MYSTIQUE_WORLD_API_KEY}
      MYSTIQUE_BUDGET_USD: ${MYSTIQUE_BUDGET_USD:-5}
      # Identity. With these unset the deployment stays open, which is what the
      # guided replay and local development both want.
      AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}
      # Encrypts stored model keys at rest. Without it the server refuses to store
      # one rather than writing it in the clear. Changing it makes existing keys
      # unreadable, so users would have to reconnect.
      MYSTIQUE_SECRET: ${MYSTIQUE_SECRET}
      # The root filesystem is read-only: accounts must live inside a mounted
      # volume or every write fails at runtime.
      MYSTIQUE_CONTAS_DIR: ${MYSTIQUE_CONTAS_DIR:-/app/good/workspace/contas}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.0
    volumes:
      - mystique-workspace:/app/good/workspace
      - mystique-evil-workspace:/app/evil/workspace

volumes:
  mystique-workspace:
  mystique-evil-workspace:
