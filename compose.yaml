services:
  workspace-init:
    build: .
    user: "0:0"
    command:
      - sh
      - -c
      - >-
        mkdir -p /app/good/workspace/adapters /app/good/workspace/bank
        /app/good/workspace/auditorias /app/evil/workspace/absorcoes
        /app/evil/workspace/bank &&
        chown -R 999:999 /app/good/workspace /app/evil/workspace
    restart: "no"
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    security_opt:
      - no-new-privileges:true
    volumes:
      - mystique-workspace:/app/good/workspace
      - mystique-evil-workspace:/app/evil/workspace

  mystique:
    build: .
    restart: unless-stopped
    depends_on:
      workspace-init:
        condition: service_completed_successfully
      credential-broker:
        condition: service_healthy
    expose:
      - "8000"
    environment:
      MYSTIQUE_MODO: ${MYSTIQUE_MODO:-good}
      MYSTIQUE_PROVIDER: ${MYSTIQUE_PROVIDER:-openai}
      MYSTIQUE_BASE_URL: ${MYSTIQUE_BASE_URL}
      MYSTIQUE_MODEL_ID: ${MYSTIQUE_MODEL_ID}
      MYSTIQUE_BUDGET_USD: ${MYSTIQUE_BUDGET_USD:-5}
      # Identity. With these unset the deployment stays open, which is what the
      # guided replay and local development both want.
      AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}
      MYSTIQUE_REQUIRE_AUTH: "true"
      MYSTIQUE_CREDENTIAL_BROKER_URL: http://credential-broker:8001
      # The root filesystem is read-only: accounts must live inside a mounted
      # volume or every write fails at runtime.
      MYSTIQUE_CONTAS_DIR: ${MYSTIQUE_CONTAS_DIR:-/app/good/workspace/contas}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.0
    volumes:
      - mystique-workspace:/app/good/workspace
      - mystique-evil-workspace:/app/evil/workspace
    networks:
      - app-egress
      - vault-link

  vault-init:
    build: .
    user: "0:0"
    # The broker runs as uid 999 on a read-only root filesystem. A fresh Docker
    # volume is root-owned and 0755, so every credential write failed with
    # EACCES and the OAuth return looked like "nothing happened". Chown once,
    # before the broker starts, exactly as workspace-init does for the app.
    command:
      - sh
      - -c
      # chmod first: once the directory belongs to uid 999, root without
      # CAP_FOWNER can no longer change its mode, and the helper exits 1.
      - chmod 700 /vault && chown 999:999 /vault
    restart: "no"
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    security_opt:
      - no-new-privileges:true
    volumes:
      - mystique-credentials:/vault

  credential-broker:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "cofre"]
    depends_on:
      vault-init:
        condition: service_completed_successfully
    environment:
      AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}
      MYSTIQUE_VAULT_KEY: ${MYSTIQUE_VAULT_KEY}
      # Migration only: derives a domain-separated 32-byte vault key from the
      # existing deployment secret. Never passed to the main application.
      MYSTIQUE_LEGACY_SECRET: ${MYSTIQUE_SECRET}
      MYSTIQUE_VAULT_DIR: /vault
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.25
    volumes:
      - mystique-credentials:/vault
    networks:
      - vault-egress
      - vault-link
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  mystique-workspace:
  mystique-evil-workspace:
  mystique-credentials:

networks:
  app-egress:
  vault-egress:
  vault-link:
    internal: true
